[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nonebot_plugin_zikequote3"
version = "0.5.0alpha2"
description = "LLM 介入，功能丰富的群聊语录自动收集与管理插件，支持自动收集、后台管理、生成排行榜、展示等功能"
authors = [
  { name = "LifeCheckpoint" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "jinja2>=3.1.6",
  "markdown>=3.9",
  "nonebot-adapter-onebot>=2.0.0",
  "nonebot-plugin-access-control-api>=1.2.1",
  "nonebot-plugin-localstore>=0.7.0",
  "nonebot2>=2.0.0",
  "openai>=1.76.0",
  "pillow>=11.3.0",
  "pydantic-ai>=1.40.0",
  "pydantic>=2.0.0",
  "pymdown-extensions>=10.16.1",
  "requests>=2.26.0",
  "sentry-sdk>=2.39.0",
  "tomlkit>=0.13.3",
  "typer>=0.19.2",
  "nonebot-plugin-alconna>=0.59.4",
  "python-dateutil>=2.9.0.post0",
  "nonebot-plugin-htmlrender>=0.6.7",
  "aiohttp>=3.13.1",
  "nonebot-plugin-waiter>=0.8.1",
  "sqlalchemy[asyncio]>=2.0.0",
  "aiosqlite>=0.20.0",
  "dishka>=1.0.0",
  "alembic>=1.15.0",
  "lancedb>=0.29.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=1.0.0",
  "nonebug>=0.4.3",
]

[project.urls]
Homepage = "https://github.com/LifeCheckpoint/nonebot_plugin_zikequote3"

[tool.nonebot]
plugins = ["nonebot_plugin_zikequote3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=nonebot_plugin_zikequote3 --cov-report=term-missing --cov-report=html"
filterwarnings = [
  "ignore:Failed to get nonebot adapters.*:RuntimeWarning",
  "ignore:No adapters found.*:RuntimeWarning",
]

[tool.coverage.run]
source = ["nonebot_plugin_zikequote3"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.",
  "@abstractmethod",
]

[tool.hatch.build]
include = [
  "nonebot_plugin_zikequote3/**",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]
exclude = [
  "/.github/**",
  "/.pytest_cache/**",
  "/.venv/**",
  "/.vscode/**",
  "/.VSCodeCounter/**",
  "/dist/**",
  "/docs/**",
  "**/*.pyc",
  "**/apikey",
  "**/api_key",
  "**/dsn",
  "**/sentry_dsn",
]

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_zikequote3"]

[dependency-groups]
dev = [
  "pytest-cov>=7.0.0",
]
